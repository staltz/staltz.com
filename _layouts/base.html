<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>André Staltz{% if title %} — {{ title }}{% endif %}</title>
  <meta name="description" content="{{ description | default: site.description }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var savedTheme = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.dataset.theme = 'dark';
      }
    }());
  </script>
  <link href="/css/main.css" rel="stylesheet">
  <link href="/css/prism-staltz.css" rel="stylesheet">
  <link rel="alternate" type="application/atom+xml" href="/feed.xml" title="{{ site.title }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site">
    <header class="site-header">
      <a class="site-header__brand" href="/">
        <span class="site-header__name">André Staltz</span>
      </a>
      <div class="site-header__actions">
        <nav class="site-nav">
          <a href="/blog.html"{% if section == 'blog' %} class="is-active"{% endif %}>Blog</a>
          <a href="/talks.html"{% if section == 'talks' %} class="is-active"{% endif %}>Talks</a>
          <a href="/about.html"{% if section == 'about' %} class="is-active"{% endif %}>About</a>
        </nav>
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg class="theme-toggle__moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15.4A9 9 0 0 1 8.6 3a7.5 7.5 0 1 0 12.4 12.4Z"></path>
          </svg>
          <svg class="theme-toggle__sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
          </svg>
        </button>
      </div>
    </header>

    <main id="main">
{{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <div class="site-footer__label">Find me</div>
        <nav class="site-footer__links">
          <a href="mailto:andre@staltz.com">Email</a>
          <a href="https://github.com/staltz">GitHub</a>
          <a href="https://twitter.com/andrestaltz">Twitter</a>
          <a href="https://bsky.app/profile/staltz.com">Bluesky</a>
          <a href="https://patreon.com/andrestaltz">Patreon</a>
          <a href="https://linkedin.com/in/andrestaltz">LinkedIn</a>
          <span class="site-footer__copy">© André Staltz</span>
        </nav>
      </div>
    </footer>
  </div>
  <script>
    (function () {
      var toggle = document.querySelector('.theme-toggle');

      function updateToggle() {
        var isDark = document.documentElement.dataset.theme === 'dark';
        var label = isDark ? 'Switch to light mode' : 'Switch to dark mode';
        toggle.setAttribute('aria-label', label);
        toggle.setAttribute('title', label);
      }

      toggle.addEventListener('click', function () {
        var isDark = document.documentElement.dataset.theme === 'dark';
        if (isDark) {
          delete document.documentElement.dataset.theme;
          localStorage.setItem('theme', 'light');
        } else {
          document.documentElement.dataset.theme = 'dark';
          localStorage.setItem('theme', 'dark');
        }
        updateToggle();
      });

      updateToggle();
    }());
  </script>
</body>
</html>
