---
layout: base
section: blog
---
<article class="wrap article">
  <a class="article__back" href="/blog.html">&larr; Blog</a>

  <header class="article__header">
    <div class="article__meta">
      <time datetime="{{ page.date | dateToRfc3339 }}">{{ page.date | dateToString }}</time>
    </div>
    <h1 class="article__title">{{ title }}</h1>
  </header>

  <div class="prose">
{{ content }}
  </div>

  <p class="article__support">
    If you found this useful, you can <a href="https://patreon.com/andrestaltz" rel="noopener noreferrer" target="_blank">support my writing on Patreon</a>.
  </p>

  <div class="article__foot">
    <span class="article__license">
      &copy; {{ page.date | year }} André Medeiros, licensed under
      <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a>
    </span>
    <a class="text-link" href="/blog.html">More essays <span class="arrow">&rarr;</span></a>
  </div>
</article>
